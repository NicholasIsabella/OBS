<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBS Windows API Map Overlay (50 Mile View)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:hidden;
}

.map-box{
  position:absolute;
  right:24px;
  bottom:24px;
  width:340px;
  height:220px;
  overflow:hidden;
  background:#111;
  box-shadow:0 14px 30px rgba(0,0,0,0.35);
}

#map{
  width:100%;
  height:100%;
}

.marker-dot{
  width:14px;
  height:14px;
  border-radius:50%;
  background:#2cc1ff;
  border:2px solid #fff;
  box-shadow:0 0 0 5px rgba(44,193,255,0.2);
}

.leaflet-control-attribution{
  font-size:9px;
}
</style>
</head>

<body>
<div class="map-box">
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const START = { lat:39.8283, lon:-98.5795, zoom:4 };

const map = L.map("map", {
  zoomControl:false,
  attributionControl:true
}).setView([START.lat, START.lon], START.zoom);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom:19
}).addTo(map);

const icon = L.divIcon({
  className:"",
  html:'<div class="marker-dot"></div>',
  iconSize:[14,14],
  iconAnchor:[7,7]
});

const marker = L.marker([START.lat, START.lon], { icon, opacity:0 }).addTo(map);

// 50 mile radius circle
const radiusCircle = L.circle([START.lat, START.lon], {
  radius: 80467, // 50 miles in meters
  color: "#2cc1ff",
  weight: 2,
  opacity: 0.6,
  fillOpacity: 0.05
}).addTo(map);

function update(lat, lon){
  marker.setOpacity(1);
  marker.setLatLng([lat, lon]);
  radiusCircle.setLatLng([lat, lon]);

  // zoom level tuned for ~50 mile view
  map.setView([lat, lon], 9, { animate:true });
}

if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(
    (pos)=>{
      update(pos.coords.latitude, pos.coords.longitude);
    },
    (err)=>{
      console.log(err);
    },
    {
      enableHighAccuracy:true,
      maximumAge:2000,
      timeout:10000
    }
  );
}
</script>
</body>
</html>
